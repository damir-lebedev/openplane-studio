# Установщики OpenPlane Studio — всё для сборки и прошивки внутри, интернет
# пользователю не нужен (tools/offline_bundle.py):
#   macOS Apple Silicon (.dmg), macOS Intel (.dmg), Windows (.exe, NSIS);
# ещё Android (.apk, arm64) и готовые прошивки firmware-<env>.bin — их шьёт
# телефон кнопкой «Скачать и прошить» (releases/latest/download/firmware-<env>.bin).
# Запуск — вручную (Actions → Установщики → Run workflow): файлы — в артефактах;
# тегом vX.Y.Z — ещё и выпуск на GitHub с постоянными именами файлов, чтобы
# кнопка «Скачать» в README вела на releases/latest/download/<имя>.
name: Установщики

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: OpenPlaneStudio-macOS-AppleSilicon
            files: src-tauri/target/release/bundle/dmg/*.dmg
            release: OpenPlane-Studio-macOS-AppleSilicon.dmg
          - name: macOS Intel
            os: macos-15-intel
            artifact: OpenPlaneStudio-macOS-Intel
            files: src-tauri/target/release/bundle/dmg/*.dmg
            release: OpenPlane-Studio-macOS-Intel.dmg
          - name: Windows
            os: windows-latest
            artifact: OpenPlaneStudio-Windows
            files: src-tauri/target/release/bundle/nsis/*.exe
            release: OpenPlane-Studio-Windows-Setup.exe
    steps:
      - uses: actions/checkout@v4
      - name: Исходники прошивки
        uses: actions/checkout@v4
        with:
          repository: damir-lebedev/OpenPlaneProject
          path: firmware
          sparse-checkout: |
            include
            src
            lib
            tools
            test/native/support
            test/native/support_stm32
            test/native/helpers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.21
      - name: Всё для работы без интернета
        run: python tools/offline_bundle.py --firmware firmware --uv uv
      - run: npm ci
      - run: npm test
      - name: Сборка
        run: npm run tauri build
      - name: Постоянное имя файла
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.files }} "out/${{ matrix.release }}"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.release }}
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android
    runs-on: ubuntu-latest
    # APK не должен держать выпуск для компьютеров: упал — выпуск без него
    continue-on-error: true
    env:
      NDK_VERSION: "28.2.13676358"
      # подпись — своим ключом (docs/ANDROID.md, «Ключ подписи»); нет секретов — APK не выкладываем
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Исходники прошивки (описание плат для телефона)
        uses: actions/checkout@v4
        with:
          repository: damir-lebedev/OpenPlaneProject
          path: firmware
          sparse-checkout: |
            include
            src
            lib
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # по умолчанию ставит пакет «tools» — его в SDK больше нет, sdkmanager падает
          packages: platform-tools
      - name: NDK и build-tools
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "build-tools;36.0.0" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Описание прошивки на телефоне (src/assets/firmware-manifest.json)
        run: python firmware/tools/opconfig.py describe --root firmware --out src/assets/firmware-manifest.json
      - run: npm ci
      - name: Сборка APK (arm64, release)
        run: npx tauri android build --apk --target aarch64
      - name: Подпись
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out out/OpenPlane-Studio-Android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs out/OpenPlane-Studio-Android.apk | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la out
      - name: Без ключа подписи
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Нет секрета ANDROID_KEYSTORE — APK собран, но не подписан и в выпуск не идёт (docs/ANDROID.md)"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: OpenPlaneStudio-Android
          path: out/OpenPlane-Studio-Android.apk
          if-no-files-found: error
          compression-level: 0

  firmware:
    name: Готовые прошивки
    runs-on: ubuntu-latest
    steps:
      - name: Исходники прошивки
        uses: actions/checkout@v4
        with:
          repository: damir-lebedev/OpenPlaneProject
          sparse-checkout: |
            include
            src
            lib
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio
      # те же сборки, что RELEASE_ENVS (src-tauri/src/update.rs, src/core/binFile.ts);
      # getfun-f405v3-quad — нет: #error до дампа платы
      - name: Сборка
        run: |
          mkdir -p out
          for env in stm32h743-devebox stm32h743-devebox-quad matek-h743 matek-h743-quad aocodarc-f405v3-quad; do
            pio run -e "$env"
            cp ".pio/build/$env/firmware.bin" "out/firmware-$env.bin"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlane-firmware
          path: out/*.bin
          if-no-files-found: error

  release:
    name: Выпуск на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # «Что нового» — текст аннотированного тега (git tag -a vX.Y.Z -m "…"):
      # его же показывает карточка обновления в приложении.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          # checkout подменяет аннотированный тег лёгким — забрать настоящий
          git -C repo fetch --force --tags origin
          git -C repo tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d' > changes.md
          if [ -s changes.md ]; then
            { echo "## Что нового"; echo; cat changes.md; echo; } > notes.md
          fi
          cat >> notes.md <<'EOF'
          Установщики OpenPlane Studio — работают без интернета: внутри Python, PlatformIO,
          компилятор и пакеты STM32 (H7, F4), библиотеки и исходники прошивки,
          WebView2 и драйвер режима прошивки (Windows).

          - Windows 10/11 x64 — `OpenPlane-Studio-Windows-Setup.exe` (SmartScreen: «Подробнее» → «Выполнить в любом случае»)
          - macOS Apple Silicon — `OpenPlane-Studio-macOS-AppleSilicon.dmg`
          - macOS Intel — `OpenPlane-Studio-macOS-Intel.dmg` (первый запуск: «Конфиденциальность и безопасность» → «Всё равно открыть»)
          - Android 7+ (arm64) — `OpenPlane-Studio-Android.apk`: настройка платы по кабелю USB-C ↔ USB-C и прошивка готовым файлом (разрешить «установку из неизвестных источников»)

          Готовые прошивки для телефона (Studio скачивает их сама кнопкой «Скачать и прошить»):
          `firmware-<сборка>.bin` — STM32H743 DevEBox и Matek H743 (самолёт и коптер), AocodaRC F405 V3 (коптер).
          На компьютере прошивка собирается под ваш аппарат — эти файлы ему не нужны.
          EOF
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "OpenPlane Studio $TAG" --notes-file notes.md
