[package]
name = "openplane-studio"
version = "0.5.0"
description = "OpenPlane Studio — настройка и прошивка полётного контроллера OpenPlane"
authors = ["Damn"]
license = "LicenseRef-OpenPlane"
edition = "2021"

[lib]
name = "openplane_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
sha2 = "0.10"

# COM-порты и USB DFU на ПК. На Android их нет (libudev, usbfs без root):
# там USB-OTG идёт через Kotlin-плагин (P47), а эти команды отвечают «недоступно».
[target.'cfg(not(target_os = "android"))'.dependencies]
serialport = "4"
nusb = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
