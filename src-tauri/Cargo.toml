[package]
name = "openplane-studio"
version = "0.1.0"
description = "OpenPlane Studio — настройка и прошивка полётного контроллера OpenPlane"
authors = ["Damn"]
license = "LicenseRef-OpenPlane"
edition = "2021"

[lib]
name = "openplane_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
nusb = "0.2"
sysinfo = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
